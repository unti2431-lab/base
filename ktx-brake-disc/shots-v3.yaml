# ---------------------------------------------------------------------
# 시그니처 루프 10초 (시리즈 아이덴트 / 다음 영상 콜드오픈 / 단독 티저 쇼츠)
#   상세 설명과 다른 부품용 템플릿은 signature-loop.md
# ---------------------------------------------------------------------
signature_loop:
  duration_s: 10.0
  frames: 240
  keyframes:
    - id: SIG-A
      derived_from: REF-1′
      op: none
      state: { assembly: assembled, caliper: clamped, cutaway: none, temperature: cool }
    - id: SIG-B
      derived_from: SIG-A
      op: edit
      prompt: >
        exploded view: the yellow caliper with its pneumatic cylinder and hoses has lifted straight up, away
        from the axle center, by about the caliper's own height; the two sintered pads have moved straight
        outward away from each disc face by about one pad thickness and float in line with their original
        positions; the disc, hub, axle and stand are unchanged.
      state: { assembly: exploded, caliper: lifted, pads: separated, cutaway: none }
    - id: SIG-C
      derived_from: SIG-B
      op: edit
      prompt: >
        the lower-right quarter of the disc, from the 3 o'clock to the 6 o'clock position, is cut away with
        perfectly flat machined cut faces, revealing two parallel friction plates joined by evenly spaced
        straight radial cooling vanes, and the cut hub flange showing the axle bore; everything else unchanged.
      state: { assembly: exploded, cutaway: lower_right_quarter }
  clips:
    - id: SIG-1
      mode: FL
      start_kf: SIG-A
      end_kf: SIG-B
      reverse_safe: true
      prompt: |
        Exploded-view motion: the yellow caliper with its pneumatic cylinder lifts straight up along its
        mounting axis, away from the axle center, while the two sintered pads slide straight outward away from
        the disc faces. Every part stays rigid and moves only along its own assembly axis. The disc, hub, axle
        and stand do not move. Camera locked. Holds still at the start and at the end.
    - id: SIG-2
      mode: FL
      start_kf: SIG-B
      end_kf: SIG-C
      reverse_safe: true
      prompt: |
        A flat cut separates the lower-right quarter of the disc, from the 3 o'clock to the 6 o'clock position;
        that quarter slides straight toward the camera and out of frame, revealing two parallel plates joined by
        straight radial cooling vanes and the cut hub. The lifted caliper, the floating pads and the rest of the
        disc stay perfectly still. Camera locked. Holds still at the start and at the end.
  edit_timeline:            # 프레임 기준(24fps)
    - { frames: [0, 6],     source: "SIG-A 정지" }
    - { frames: [6, 60],    source: "SIG-1 정방향", speed_factor: 2.22 }
    - { frames: [60, 114],  source: "SIG-2 정방향", speed_factor: 2.22 }
    - { frames: [114, 126], source: "SIG-C 정지(리빌 비트) + 절개면 흰 글린트 1회" }
    - { frames: [126, 180], source: "SIG-2 역재생", speed_factor: 2.22 }
    - { frames: [180, 234], source: "SIG-1 역재생", speed_factor: 2.22 }
    - { frames: [234, 240], source: "SIG-A 정지 → 0프레임으로 루프" }
