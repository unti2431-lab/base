# =====================================================================
# KTX 차축 제동 디스크 숏폼 — 19컷 상세 명세 v3 (LLM 입력용)
# ---------------------------------------------------------------------
# 이 파일은 사람이 아니라 LLM/자동화 도구가 읽고 그대로 실행하도록 쓴 명세입니다.
# 사람용 설명은 shot-list-v2.md(연출 의도)와 signature-loop.md(시그니처 루프 템플릿)를 보세요.
#
# v2 → v3 변경점
#   1. 모든 컷을 같은 필드 구조로 정규화(타임코드·프레임·배속·홀드·프롬프트 전문).
#   2. 시리즈 공통 톤앤매너(series_lock)를 분리 → 다음 영상에서 hero만 바꿔 재사용.
#   3. 단면 절개 위치를 "오른쪽 아래 1/4(시계 3시~6시)"로 통일.
#      이유: 캘리퍼가 원판 위쪽을 덮고 있어 오른쪽 위 1/4은 절개면이 가려짐.
#      시그니처 루프와 같은 규칙을 써서 두 영상의 단면이 같은 모양으로 보이게 함.
#   4. 배경을 REF-1 기준 미드 그레이로 확정(v1의 다크 차콜 폐기).
#   5. 시그니처 루프(10초) 키프레임·클립을 같은 파일에 포함.
# =====================================================================

meta:
  title: "시속 300km KTX를 세우는 건 '쇠 원판'이다"
  version: v3
  duration_s: 55.0
  fps: 24
  total_frames: 1320
  resolution: { width: 1080, height: 1920, aspect: "9:16" }
  loop: true                     # 마지막 프레임(5-5 끝) == 첫 프레임(1-1 시작) == REF-2′
  generator:
    keyframes: "Google Flow 이미지 생성/편집"
    video: "Omni 1.1 — First & Last Frame (FL) / Image to Video (I2V)"
    edit: "CapCut"
  generation_unit_s: 5           # 콘솔이 10초만 지원하면 10으로 바꾸고 speed_factor를 2배로
  voice: { engine: ElevenLabs, stability: 0.45, speed: 1.05 }

# ---------------------------------------------------------------------
# LLM 실행 규칙 — 프롬프트를 조립하거나 컷을 수정할 때 반드시 지킬 것
# ---------------------------------------------------------------------
rules_for_llm:
  prompt_assembly: >
    keyframe 프롬프트 = series_lock.text + hero.text + keyframe.prompt.
    파생(edit) keyframe 프롬프트 = blocks.edit_prefix + keyframe.prompt (series_lock/hero는 붙이지 않음, 원본 이미지가 대신함).
    clip 프롬프트 = series_lock.text + clip.prompt + blocks.negative_common (+ reverse_safe가 true면 blocks.negative_reverse_safe).
    world가 track인 컷은 series_lock 대신 blocks.track_lock을 사용.
  invariants:
    - "한 클립에 형태 변화는 하나만. 카메라가 움직이는 클립(I2V push-in)은 피사체 형태 변화가 없어야 한다."
    - "FL 클립은 카메라 고정(locked-off)."
    - "start_kf와 end_kf는 반드시 같은 캔버스에서 편집으로 파생된 쌍이어야 한다."
    - "FL 클립은 잘라내지(trim) 말고 speed_factor로만 길이를 맞춘다. 끝 프레임이 루프와 역재생의 기준이다."
    - "reverse_safe: true인 클립에는 불꽃·연기·입자·아지랑이가 생성되면 안 된다."
    - "생성 이미지/영상에 글자·숫자·로고가 있으면 탈락. 모든 글자는 post 레이어에서만."
    - "프롬프트에 cm·mm·bar 같은 수치, 'sub-millimeter', 'zero tolerance' 같은 정밀도 문구를 넣지 않는다. 거리는 '부품 두께만큼'처럼 상대 표현으로."
    - "캘리퍼 색(머스터드 옐로)과 형태는 모든 컷에서 동일해야 한다."
    - "단면 절개는 항상 원판의 오른쪽 아래 1/4(시계 3시~6시), 절개면은 평평한 가공면."
  crops: >
    crop 좌표 [x, y, w, h]는 derived_from 이미지 기준 정규화 값. 원본이 9:16이므로 w == h여야 9:16이 유지된다.
    w가 0.5 미만인 크롭은 해상도가 부족하므로 단순 crop이 아니라 crop_then_edit(재묘사)로 처리하고 1080x1920으로 맞춘다.
  holds: "FL 클립은 편집에서 시작·끝 프레임을 각각 hold_frames만큼 정지시킨다(역재생 이음매에서 속도 0)."
  speed_factor: "원본 생성 길이(generation_unit_s) ÷ 최종 길이(duration_s - hold 시간). 표의 값은 hold 포함 근사치."

# ---------------------------------------------------------------------
# 시리즈 공통 톤앤매너 — 다음 영상에서도 그대로 사용
# ---------------------------------------------------------------------
series_lock:
  name: "MECHANICAL SPECIMEN"
  text: |
    Vertical 9:16 photoreal industrial specimen render. Seamless mid-grey studio backdrop with a soft
    vertical gradient, slightly lighter behind the subject. Soft key light from upper left, cool rim light
    from right, one soft fixed contact shadow under the subject. The object stands on a dark machined-steel
    display stand. Materials read as real metal: brushed steel, forged steel, painted cast steel.
    Rigid-body engineering motion only: every part moves as one solid piece along its own assembly axis.
    No text, no letters, no numbers, no logos, no people.
  palette:
    backdrop: "#8E9194 → #B4B6B8 (세로 그라데이션)"
    hero_accent: "에피소드별 1색. KTX 제동 편 = 머스터드 옐로 #C9A227"
    heat: "#FF6A1A(오렌지) → #C8261B(레드) — 열 표현에만"
    xray_air: "#3FC5F0(시안) — X-ray 투명화와 차가운 공기에만"
    temper: "강철 표면의 옅은 청보라 템퍼 링 — 열 이력 디테일"
  hud:
    font: "모노스페이스(예: JetBrains Mono, Roboto Mono), 대문자"
    color: "흰색 #F2F2F2 + 강조 시안 #3FC5F0, 경고는 오렌지 #FF6A1A"
    safe_area:
      hud_top: "화면 높이 8%~18%, 왼쪽 정렬"
      subtitle: "화면 높이 68%~78%(하단 22~32% 구간), 한 줄 최대 14자, 최대 2줄"
      keep_clear: "하단 22% 아래 전체, 오른쪽 15% 세로 띠(쇼츠 UI)"

hero:
  id: KTX_BRAKE_DISC
  text: |
    Subject: a ventilated railway brake disc with continuous brushed-steel friction faces and a faint
    blue-purple heat-temper ring, straight radial cooling-vane openings evenly spaced around the outer edge,
    a bolted central hub flange on a dark forged-steel axle; a mustard-yellow cast-steel brake caliper
    bridging the top of the disc with two dark sintered pads, one on each face; a small silver pneumatic
    cylinder with black air hoses mounted on the caliper's right side.

blocks:
  edit_prefix: |
    Keep the exact same camera, framing, object positions, object sizes, shapes, materials and lighting.
    Change only:
  track_lock: |
    Vertical 9:16 photoreal low-angle action shot beside a high-speed train running at full speed,
    golden backlight from a low sun, strong motion blur on sleepers, ballast and rails, sharp brake disc and
    mustard-yellow caliper. No text, no letters, no numbers, no logos, no people.
  negative_common: |
    No morphing, no melting, no bending or warping of metal, no new parts appearing, no parts disappearing
    except where described, no floating debris, no text.
  negative_reverse_safe: |
    No sparks, no smoke, no particles, no heat haze, no dust.

# ---------------------------------------------------------------------
# 레퍼런스 정비 (사용자 제공 이미지 2장)
# ---------------------------------------------------------------------
references:
  - id: REF-1
    file: "ref/ref1_studio.webp"        # 사용자가 제공한 노란 캘리퍼 스튜디오 컷, 941x1672
    role: "해부 세계(studio) 형상 마스터"
  - id: REF-1′
    derived_from: REF-1
    op: edit
    prompt: |
      Remove the two vertical seam lines on the brake disc so each friction face is one continuous,
      uninterrupted brushed-steel surface. Remove all engraved letters and numbers on the hub flange,
      leaving plain machined metal with bolt holes. Keep the faint blue-purple heat-temper ring.
    post: "1080x1920 업스케일"
    state: { caliper: clamped, temperature: cool, cutaway: none }
  - id: REF-2
    file: "ref/ref2_track.webp"         # 사용자가 제공한 주행 현장 컷, 941x1672
    role: "현실 세계(track) 분위기 마스터"
  - id: REF-2′
    derived_from: [REF-2, REF-1′]
    op: edit
    prompt: |
      Replace only the silver brake caliper on the right side of the glowing disc with the mustard-yellow
      cast brake caliper from the second reference image, with the same small silver pneumatic cylinder and
      black air hoses, sized to fit the disc. Keep the disc glow exactly as it is. No text, no logos.
    alt_B: |
      (정확도 우선 재생성) Vertical 9:16 photoreal low-angle shot from the middle of the track, under a
      high-speed train running at full speed, looking sideways at one wheelset: two wheels on the rails at
      the edges of frame, the axle between them carrying ventilated brake discs, the nearest disc glowing
      orange-red at its rim, gripped by a mustard-yellow caliper like the reference. Golden backlight,
      strong motion blur on sleepers and ballast, sharp disc and caliper. No text, no logos.
    post: "1080x1920 업스케일"
    note: "원본 REF-2는 원판이 바퀴 바깥쪽에 있어 실제 배치와 다름. alt_B가 정확함"
    state: { caliper: clamped, temperature: hot, world: track }

# ---------------------------------------------------------------------
# 키프레임 19장 (+ 레퍼런스 정비본 REF-1′, REF-2′)
#   crop: 원본 기준 정규화 좌표 [x, y, w, h] (0~1), 9:16 비율 유지 후 1080x1920 업스케일
# ---------------------------------------------------------------------
keyframes:
  - id: KF-S0
    derived_from: REF-2′
    op: edit
    world: studio
    prompt: >
      the train body, rails, sleepers, ballast, overhead wires and sky are replaced by a seamless mid-grey
      studio backdrop with one soft contact shadow; the wheel, axle, glowing brake disc and yellow caliper
      remain in exactly the same position, size and glow, now perfectly sharp with no motion blur.
    state: { caliper: clamped, temperature: hot }

  - id: KF-B1
    derived_from: null
    reference_images: [REF-1′]
    op: generate
    prompt: >
      3/4 high-angle wide view of a simplified high-speed passenger-car bogie standing on the studio floor:
      solid grey bogie frame with coil springs, two axles, each axle carrying four ventilated brake discs
      between its two wheels, each disc gripped by a mustard-yellow caliper like the reference.
      The bogie fills the middle 60% of the frame height.
    state: { xray: false }
  - id: KF-B2
    derived_from: KF-B1
    op: edit
    prompt: >
      the bogie frame, springs and dampers become a translucent glowing cyan X-ray wireframe; axles, wheels,
      discs and calipers stay solid and opaque.
    state: { xray: true }

  - id: KF-C1
    derived_from: REF-1′
    op: crop_then_edit
    crop: [0.62, 0.08, 0.36, 0.36]
    prompt: >
      the silver pneumatic cylinder body becomes semi-transparent glass-like metal, showing an empty chamber
      and a retracted piston rod inside; hoses unchanged.
    state: { air: empty, rod: retracted }
  - id: KF-C2
    derived_from: KF-C1
    op: edit
    prompt: >
      the chamber is filled with softly glowing cyan compressed air and the piston rod is extended out of
      the cylinder along its own axis.
    state: { air: full, rod: extended }

  - id: KF-E
    derived_from: REF-1′
    op: crop_then_edit
    crop: [0.14, 0.04, 0.78, 0.78]
    prompt: >
      the yellow caliper housing becomes semi-transparent, revealing two internal lever arms shaped like
      tongs, one on each side of the disc, pivoting on visible pins; the levers are open and there is a clear
      gap between each pad and the disc face.
    state: { caliper: open, xray: true }
  - id: KF-F
    derived_from: KF-E
    op: edit
    prompt: >
      the two tong levers are closed and both pads press flat against both disc faces.
    state: { caliper: clamped, xray: true }

  - id: KF-P1
    derived_from: null
    reference_images: [REF-1′]
    op: generate
    prompt: >
      extreme close-up looking along the disc face edge-on: the disc thickness fills the center with the
      straight cooling vanes visible between two plates, one dark sintered pad on each side held by the
      yellow caliper, a small visible gap between each pad and the disc.
    state: { pads: open }
  - id: KF-P2
    derived_from: KF-P1
    op: edit
    prompt: >
      both pads touch both disc faces; a thin orange glowing line runs along each contact edge.
    state: { pads: clamped, glow: contact_line }

  - id: KF-H1
    derived_from: REF-1′
    op: crop
    crop: [0.06, 0.22, 0.76, 0.76]
    prompt: null
    note: "원판 정면 마찰면 클로즈업, 캘리퍼 하단이 프레임 위쪽에 살짝 걸림. 차가운 상태"
    state: { temperature: cool }
  - id: KF-H2
    derived_from: KF-H1
    op: edit
    prompt: >
      the friction face glows orange at the outer rim, blending into deep red toward the middle; the hub
      flange stays dark cool metal; surface texture and temper ring shapes stay identical.
    state: { temperature: hot }

  - id: KF-J1
    derived_from: KF-H2
    op: crop_then_edit
    crop: [0.25, 0.17, 0.40, 0.40]
    prompt: >
      sharpen into a macro view of the joint where the glowing friction ring meets the dark cool hub flange,
      bolts and round bushings clearly visible.
    state: { temperature: hot, xray: false }
  - id: KF-J2
    derived_from: KF-J1
    op: edit
    prompt: >
      the hub flange becomes semi-transparent, revealing radial sliding bushings that connect the friction
      ring to the hub; the fit is tight with no gaps.
    state: { xray: true, gap: none }
  - id: KF-J3
    derived_from: KF-J2
    op: edit
    prompt: >
      the glowing friction ring sits slightly further outward from the hub; a small visible gap has opened at
      each bushing.
    state: { xray: true, gap: open }

  - id: KF-K0
    derived_from: REF-1′
    op: edit
    prompt: >
      the whole friction face glows orange-red, the hub stays dark; caliper unchanged and still clamped.
    state: { temperature: hot, cutaway: none }
  - id: KF-K1
    derived_from: KF-K0
    op: edit
    prompt: >
      the lower-right quarter of the disc, from the 3 o'clock to the 6 o'clock position, is cut away with
      perfectly flat machined cut faces, revealing two parallel friction plates joined by evenly spaced
      straight radial cooling vanes with air channels between them; the cut faces are bright machined steel.
    state: { temperature: hot, cutaway: lower_right_quarter }
  - id: KF-K2
    derived_from: KF-K1
    op: crop_then_edit
    crop: [0.42, 0.50, 0.40, 0.40]
    prompt: >
      re-render this close-up of the flat cut face at full sharp detail: two parallel friction plates and the
      evenly spaced straight radial cooling vanes between them, bright machined cut faces.
    note: "절개면 클로즈업(두 판 + 방사형 핀). I2V 입력"
  - id: KF-K3
    derived_from: KF-K1
    op: edit
    prompt: >
      translucent cyan air streams enter near the hub and travel outward between the vanes, turning orange as
      they exit at the rim.
    state: { airflow: visible }
  - id: KF-K4
    derived_from: REF-1′
    op: crop_then_edit
    crop: [0.50, 0.40, 0.45, 0.45]
    prompt: >
      side view of the disc edge with its row of vane openings, the disc glowing orange-red; faint orange heat
      plumes leaving the openings.
    state: { temperature: hot, plumes: visible }

# ---------------------------------------------------------------------
# 19컷 명세
#   mode: FL(시작·끝 프레임) | I2V(단일 이미지) | POST(CapCut만) | REV(기존 클립 역재생)
#   reverse_safe: true → 이후 REV로 재사용되므로 불꽃·연기·입자 금지
# ---------------------------------------------------------------------
shots:

  # ================= S1 HOOK =================
  - id: "1-1"
    section: S1_hook
    time: { in: 0.0, out: 2.5, duration_s: 2.5, frames: 60 }
    narration: { text: "시속 300킬로로 달리는 KTX를", sync: "'300'에 HUD 카운터가 300에 도달" }
    world: track
    shot: { size: WS, angle: "로우앵글, 레일 높이", lens_feel: "24mm 광각", subject_position: "원판 중심이 화면 (0.62, 0.55)" }
    generation:
      mode: FL
      start_kf: REF-2′
      end_kf: REF-2′
      fallback_mode: I2V
      gen_length_s: 5
      speed_factor: 2.0
      hold_frames: { start: 0, end: 0 }
    reverse_safe: false
    subject: { start: "질주 중, 원판 외곽 발광", end: "동일(루프)" }
    motion: { primary: "바닥·레일이 흐르는 모션 블러 + 원판 발광 맥동", forbidden: ["카메라 이동", "열차 위치 변화"] }
    camera: locked
    cg_in_generation: ["모션 블러", "발광 맥동"]
    cg_post:
      - "HUD 카운터 `000 → 300 km/h`, 0.0~1.6초 이징, 상단 HUD 영역"
      - "화면 좌우 가장자리 속도선(스크린 블렌드 30%)"
    sfx: ["Train Rush(0.0)", "Brake Screech 시작(1.8)"]
    transition: { in: "루프: 5-5의 마지막 프레임과 동일 이미지", out: "컷(1-2 첫 프레임은 정지된 REF-2′)" }
    prompt: |
      The high-speed train keeps running at full speed. Ballast and rails stream past with strong motion blur,
      the brake disc rim pulses with orange-red glow. The train, wheel, disc and caliper stay in the same place
      in frame. Camera locked. The clip ends exactly as it started.
    qc_reject: ["열차·원판 위치가 이동", "캘리퍼 색 변화", "1초 이상 거의 정지(→ I2V로 대체)"]

  - id: "1-2"
    section: S1_hook
    time: { in: 2.5, out: 6.0, duration_s: 3.5, frames: 84 }
    narration: { text: "멈춰 세우는 건, 지름 64센티 쇠 원판입니다.", sync: "'멈춰'에 타임 프리즈(첫 프레임), '64센티'에 원형 스트로크" }
    world: "track → studio"
    shot: { size: WS, angle: "1-1과 동일", lens_feel: "24mm", subject_position: "1-1과 동일" }
    generation:
      mode: FL
      start_kf: REF-2′
      end_kf: KF-S0
      gen_length_s: 5
      speed_factor: 1.5
      hold_frames: { start: 6, end: 6 }
    reverse_safe: true
    subject: { start: "주행 장면 정지 상태", end: "같은 위치의 원판·바퀴·캘리퍼만 남은 그레이 스튜디오" }
    motion: { primary: "배경이 가장자리부터 회색 스튜디오로 벗겨짐(피사체 고정)", forbidden: ["피사체 이동·크기 변화", "카메라 이동"] }
    camera: locked
    cg_in_generation: ["월드 스위치(배경 전환)"]
    cg_post:
      - "0프레임: 흰색 플래시 2프레임 + 크로매틱 수차 6프레임"
      - "끝 1초: 원판 둘레에 흰 원형 스트로크가 시계 방향으로 그려짐 + `Ø 640 mm` 라벨"
    sfx: ["Time-Freeze Hit(2.5)", "Sub Drop(2.6)", "Reverse Whoosh(3.0)"]
    transition: { in: "컷 + 플래시", out: "컷" }
    prompt: |
      Time freezes: the speeding scene is completely still. Then the train body, rails, ballast, overhead wires
      and sky peel away from the edges of the frame and are replaced by a seamless mid-grey studio backdrop.
